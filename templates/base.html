<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}HANA Diagnostic Viewer{% endblock %}</title>
<link rel="stylesheet" href="/static/css/main.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<nav class="navbar">
  <div class="nav-brand">
    <span class="brand-icon">⬡</span>
    <span class="brand-text">HANA Diagnostic Viewer</span>
    <span class="brand-sub">Python · SAP HANA Crash · OOM · Log Analysis</span>
  </div>
  <div class="nav-links">
    <a href="/" class="nav-link {% if page=='dashboard' %}active{% endif %}">Dashboard</a>
    <a href="/logs" class="nav-link {% if page=='logs' %}active{% endif %}">Log Viewer</a>
    <a href="/api/report" class="nav-link" target="_blank">JSON API</a>
  </div>
  <div class="nav-upload">
    {% if trace_dir %}
    <span class="meta-tag" title="{{ trace_dir }}">📂 {{ trace_dir }}</span>
    <form method="POST" action="/api/rescan" style="display:inline">
      <button type="submit" class="upload-btn" style="border:none">🔄 Re-scan</button>
    </form>
    {% endif %}
    <form method="POST" action="/api/upload" enctype="multipart/form-data">
      <label class="upload-btn">
        <span>⬆ Upload File</span>
        <input type="file" name="file" onchange="this.form.submit()" hidden accept=".trc,.log,.txt,.dmp">
      </label>
    </form>
  </div>
</nav>
<main class="main-content">
{% block content %}{% endblock %}
</main>
<footer class="footer">SAP HANA Diagnostic Viewer (Python) — generated at {{ now }}</footer>
</body>
</html>
