# Candidate universe for the US "new stock" discovery screen.
#
# A sector-diversified set of large/mega-cap, well-covered-by-yfinance US
# stocks. This is NOT exhaustive (not the full S&P 500) -- it's a reasonable
# starting list you can edit. Tickers already in config/universe.yaml
# (i.e. things you already hold) are auto-excluded at runtime even if they
# accidentally appear here too, so don't worry about manually deduping
# against your holdings.
